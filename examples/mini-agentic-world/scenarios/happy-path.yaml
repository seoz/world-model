scenario:
  name: refund-drafted-checked-approved-paid
  kind: happy-path
  record: RF-1001
  steps:
    - input: "The checker agent checks the 120 refund drafted by the drafter agent."
      as: checker-agent
      transition: check
      expect: ALLOW
      because: >
        State: drafted = check.from. Role: checker-agent has checker.
        Guard C1_no_self_check: checker-agent != refund.drafter (drafter-agent) → true. Global C3: 120 > 0.
    - input: "The approver approves it."
      as: approver-1
      transition: approve
      expect: ALLOW
      because: >
        State: checked = approve.from. Role: approver-1 has approver.
        Guard C2_within_limit: 120 <= 500 → true.
    - input: "The payout agent pays the approved refund."
      as: payout-agent
      transition: pay
      expect: ALLOW
      because: >
        State: approved = pay.from. Role: payout-agent has payer. No guards. Global C3: 120 > 0.
